name: Nexora AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-lint:
    name: Backend Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint Backend Code with Ruff
        run: |
          ruff check backend/ --exit-non-zero-on-fix

      - name: Execute Pytest Suite (Unit, Integration & Scalability)
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
          LOG_STRUCTURED: "true"
        run: |
          python -m pytest backend/tests -v --tb=short

  frontend-lint-and-typecheck:
    name: Frontend Lint & Build Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci || npm install

      - name: Validate TypeScript & Next.js Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run build
